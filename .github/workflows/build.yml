name: Build Wisam

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make
    
    - name: Build Wisam
      run: make
    
    - name: Run tests
      run: make test
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wisam-linux
        path: wisam

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Wisam
      run: make
    
    - name: Run tests
      run: make test
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wisam-macos
        path: wisam

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
    
    - name: Build Wisam
      shell: msys2 {0}
      run: mingw32-make
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wisam-windows
        path: wisam.exe
