name: Build Wisam

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make

    - name: Create build directory
      run: mkdir -p build

    - name: Build Wisam
      run: |
        make clean || true
        make all

    - name: Verify build
      run: |
        ls -la wisam
        file wisam

    - name: Run tests
      run: make test
      continue-on-error: true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wisam-linux
        path: wisam
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install gcc make || true

    - name: Create build directory
      run: mkdir -p build

    - name: Build Wisam
      run: |
        make clean || true
        make all

    - name: Verify build
      run: |
        ls -la wisam
        file wisam

    - name: Run tests
      run: make test
      continue-on-error: true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wisam-macos
        path: wisam
        retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pkg-config

    - name: Create build directory
      shell: msys2 {0}
      run: mkdir -p build

    - name: Build Wisam
      shell: msys2 {0}
      run: |
        mingw32-make clean || true
        mingw32-make all

    - name: Verify build
      shell: msys2 {0}
      run: |
        ls -la wisam.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wisam-windows
        path: wisam.exe
        retention-days: 30
