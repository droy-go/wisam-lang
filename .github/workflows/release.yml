name: Release Wisam

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Wisam ${{ github.ref }}
        draft: false
        prerelease: false
        body: |
          ## 🚀 إصدار جديد من لغة وسام
          ## New Release of Wisam Programming Language
          
          ### التنزيلات / Downloads
          - Linux: `wisam-linux`
          - macOS: `wisam-macos`
          - Windows: `wisam-windows.exe`
          
          ### التثبيت / Installation
          ```bash
          # Linux/Mac
          chmod +x wisam
          ./wisam --version
          
          # Windows
          wisam.exe --version
          ```

  build-and-upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            asset_name: wisam-linux
          - os: macos-latest
            target: macos
            asset_name: wisam-macos
          - os: windows-latest
            target: windows
            asset_name: wisam-windows.exe
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Build (Linux/Mac)
      if: matrix.target != 'windows'
      run: make
    
    - name: Build (Windows)
      if: matrix.target == 'windows'
      shell: pwsh
      run: |
        choco install mingw
        mingw32-make
    
    - name: Upload Release Asset (Linux/Mac)
      if: matrix.target != 'windows'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./wisam
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/octet-stream
    
    - name: Upload Release Asset (Windows)
      if: matrix.target == 'windows'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./wisam.exe
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/octet-stream
